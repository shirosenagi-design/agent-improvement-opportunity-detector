<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PROJECT 04 V6.2 Research Trial architecture</title>
  <desc id="desc">The implemented User message, MBTI, short self-introduction, synthetic population baseline, personalized reasoning, Strands Evaluation Orchestrator and bounded tools, TrialResult, neutral questions to test, and terminal Developer judgment boundary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d0e"/>
      <stop offset="0.55" stop-color="#111416"/>
      <stop offset="1" stop-color="#0d0f10"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191d1f"/>
      <stop offset="1" stop-color="#141719"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.018"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#747b7d"/>
    </marker>
    <marker id="coral-arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ff7b6b"/>
    </marker>
    <style>
      .title{font:750 27px Inter,"Segoe UI",Arial,sans-serif;fill:#f1f0ec;letter-spacing:.4px}
      .brand{font:750 11px Inter,"Segoe UI",Arial,sans-serif;fill:#a5abad;letter-spacing:2.6px}
      .tagline{font:600 18px Inter,"Segoe UI",Arial,sans-serif;fill:#d8d7d3}
      .kicker{font:750 10px Inter,"Segoe UI",Arial,sans-serif;fill:#f2aaa0;letter-spacing:1.5px}
      .heading{font:700 16.5px Inter,"Segoe UI",Arial,sans-serif;fill:#f1f0ec}
      .body{font:400 12.5px Inter,"Segoe UI",Arial,sans-serif;fill:#c2c6c6}
      .body-strong{font:650 12.5px Inter,"Segoe UI",Arial,sans-serif;fill:#eceae6}
      .mono{font:500 11.5px "Cascadia Mono",Consolas,monospace;fill:#c8cccc}
      .micro{font:650 9.5px Inter,"Segoe UI",Arial,sans-serif;fill:#8f9698;letter-spacing:.55px}
      .card{fill:url(#panel);stroke:#303638;stroke-width:1.2;rx:10;filter:url(#shadow)}
      .tool{fill:#15191b;stroke:#343a3c;stroke-width:1.1;rx:8}
      .coral-card{fill:#211716;stroke:#8c5149;stroke-width:1.5;rx:10;filter:url(#shadow)}
      .human-card{fill:#251918;stroke:#ff7b6b;stroke-width:1.8;rx:10;filter:url(#shadow)}
      .chip{fill:#252a2c;stroke:#42484a;stroke-width:1;rx:12}
      .chip-text{font:750 9px Inter,"Segoe UI",Arial,sans-serif;fill:#c9cdcd;letter-spacing:.65px}
      .line{fill:none;stroke:#747b7d;stroke-width:1.8;marker-end:url(#arrow)}
      .line-plain{fill:none;stroke:#62686a;stroke-width:1.45}
      .line-coral{fill:none;stroke:#ff7b6b;stroke-width:2;marker-end:url(#coral-arrow)}
      .return{fill:none;stroke:#747b7d;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrow)}
      .rule{stroke:#2a3033;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <path d="M48 34H72V42H56V58H48Z" fill="#ff7b6b"/>
  <path d="M80 34H88V58H64V50H80Z" fill="#d9685b"/>
  <text x="104" y="52" class="title">PROJECT 04 · V6.2</text>
  <text x="104" y="74" class="brand">PERSONALIZATION OPPORTUNITY MINING</text>
  <text x="600" y="52" class="tagline">What becomes visible when an AI reasons for one person?</text>
  <text x="600" y="75" class="body">Population-oriented baseline → personalized reasoning → neutral questions → human judgment</text>
  <rect x="1332" y="34" width="220" height="30" class="chip"/>
  <text x="1442" y="53" text-anchor="middle" class="chip-text">LIVE RESEARCH TRIAL</text>
  <line x1="48" y1="96" x2="1552" y2="96" class="rule"/>

  <!-- Request path -->
  <g id="developer">
    <rect x="48" y="118" width="242" height="114" class="card"/>
    <rect x="48" y="118" width="4" height="114" rx="2" fill="#ff7b6b"/>
    <text x="70" y="142" class="kicker">HUMAN</text>
    <text x="70" y="167" class="heading">Developer / Reviewer</text>
    <text x="70" y="191" class="body">Starts one live trial</text>
    <text x="70" y="211" class="body">Retains final judgment</text>
  </g>

  <g id="browser">
    <rect x="326" y="118" width="422" height="114" class="card"/>
    <text x="348" y="142" class="kicker">BROWSER UI · TRIALREQUEST INPUT</text>
    <text x="348" y="167" class="heading">User message + cold-start profile</text>
    <text x="348" y="191" class="body">Self-reported MBTI · Short self-introduction</text>
    <text x="348" y="211" class="body">Synthetic population preset · weights · base persona</text>
  </g>

  <g id="fastapi">
    <rect x="784" y="118" width="330" height="114" class="card"/>
    <text x="806" y="142" class="kicker">FASTAPI · APP.PY</text>
    <text x="806" y="167" class="mono">POST /api/trial</text>
    <text x="806" y="191" class="body">TrialRequest → TrialResult</text>
    <text x="806" y="211" class="body">Key stays on the server</text>
  </g>

  <g id="orchestrator">
    <rect x="1150" y="118" width="402" height="114" class="coral-card"/>
    <text x="1172" y="142" class="kicker">STRANDS AGENT</text>
    <text x="1172" y="167" class="heading">Evaluation Orchestrator</text>
    <text x="1172" y="191" class="body">Calls bounded tools and records actual trace events</text>
    <text x="1172" y="211" class="body">Builds evidence-backed, neutral Questions to test</text>
  </g>

  <path d="M290 175H326" class="line"/>
  <path d="M748 175H784" class="line"/>
  <path d="M1114 175H1150" class="line"/>

  <!-- Provider boundary -->
  <g id="provider-boundary">
    <rect x="48" y="264" width="1504" height="94" class="card"/>
    <text x="70" y="288" class="kicker">SHARED MODEL / TRANSPORT BOUNDARY</text>
    <line x1="530" y1="282" x2="530" y2="342" class="rule"/>
    <line x1="1088" y1="282" x2="1088" y2="342" class="rule"/>

    <text x="70" y="315" class="heading">Same base model and persona</text>
    <text x="70" y="338" class="body">Same User message · same truthfulness and safety floor</text>

    <text x="554" y="315" class="heading">Strands OpenAIModel</text>
    <text x="730" y="315" class="body">· one caller-owned AsyncOpenAI client</text>
    <text x="554" y="338" class="body">truststore SSLContext · verified async httpx · max_retries=0 · closed in finally</text>

    <text x="1112" y="315" class="heading">Security boundary</text>
    <text x="1112" y="338" class="body">API key server-side only · never returned in TrialResult</text>
  </g>
  <path d="M1351 232V248H800V264" class="line"/>

  <!-- Bounded tool loop -->
  <rect x="48" y="388" width="1504" height="228" class="card"/>
  <text x="70" y="414" class="kicker">BOUNDED TOOL LOOP · ACTUAL EXECUTION EVENTS → AGENT TRACE</text>

  <g id="tool-population">
    <rect x="70" y="432" width="458" height="72" class="tool"/>
    <text x="90" y="456" class="mono">prepare_synthetic_population</text>
    <text x="90" y="480" class="body">Deterministic aggregate profile · no real-user data</text>
  </g>
  <g id="tool-user-model">
    <rect x="570" y="432" width="458" height="72" class="tool"/>
    <text x="590" y="456" class="mono">infer_provisional_user_model</text>
    <text x="590" y="480" class="body">MBTI weak bootstrap · introduction/task stronger · hypothesis</text>
  </g>
  <g id="tool-population-response">
    <rect x="1070" y="432" width="458" height="72" class="tool"/>
    <text x="1090" y="456" class="mono">generate_population_mode_response</text>
    <text x="1090" y="480" class="body">Population-oriented baseline · broad preference pressure</text>
  </g>
  <g id="tool-personalized-response">
    <rect x="70" y="524" width="458" height="72" class="tool"/>
    <text x="90" y="548" class="mono">generate_personalized_mode_response</text>
    <text x="90" y="572" class="body">Personalized reasoning · provisional model · same safety floor</text>
  </g>
  <g id="tool-measure">
    <rect x="570" y="524" width="458" height="72" class="tool"/>
    <text x="590" y="548" class="mono">measure_current_pair</text>
    <text x="590" y="572" class="body">Supporting surface evidence · never a quality score</text>
  </g>
  <g id="tool-reprobe">
    <rect x="1070" y="524" width="458" height="72" class="tool"/>
    <text x="1090" y="548" class="mono">run_one_counterfactual_probe</text>
    <text x="1090" y="572" class="body">Optional · at most one · genuine ambiguity only</text>
  </g>

  <path d="M1351 232V374H800V388" class="line"/>
  <path d="M800 388V374H1374V232" class="return"/>

  <!-- Result and human boundary -->
  <g id="trial-result">
    <rect x="48" y="650" width="724" height="132" class="card"/>
    <text x="70" y="675" class="kicker">PYDANTIC RESPONSE SCHEMA</text>
    <text x="70" y="701" class="heading">TrialResult</text>
    <text x="70" y="725" class="body">PopulationProfile · ProvisionalUserModel · raw Population / Personalized responses</text>
    <text x="70" y="747" class="body">Deterministic measurements · OpportunityPacket · AgentTraceEvent[] · model</text>
    <text x="70" y="769" class="body-strong">population_is_synthetic = true</text>
  </g>

  <g id="developer-judgment">
    <rect x="808" y="650" width="744" height="132" class="human-card"/>
    <text x="830" y="675" class="kicker">RESEARCH BOUNDARY · HUMAN REVIEW</text>
    <text x="830" y="701" class="heading">Observed difference → Questions to test → Developer judgment</text>
    <text x="830" y="725" class="body">Evidence and exact excerpts are surfaced without choosing a winner.</text>
    <text x="830" y="747" class="body">No automatic adoption · no generalization · no implementation prescription</text>
    <text x="830" y="769" class="body-strong">No agent/model update · final judgment remains human</text>
  </g>

  <path d="M800 616V634H410V650" class="line"/>
  <path d="M772 716H808" class="line-coral"/>

  <!-- API/UI return path -->
  <path d="M48 716H26V246H949V232" class="return"/>
  <rect x="24" y="350" width="106" height="22" class="chip"/>
  <text x="77" y="365" text-anchor="middle" class="chip-text">TRIALRESULT</text>

  <text x="48" y="840" class="micro">V6.2 RESEARCH BOUNDARY · PERSONALIZED IS NOT AUTOMATICALLY BETTER · SYNTHETIC POPULATION ≠ REAL USERS / RLHF</text>
  <text x="1552" y="840" text-anchor="end" class="micro">OUTPUT = EVIDENCE + NEUTRAL QUESTIONS</text>
  <line x1="48" y1="860" x2="1552" y2="860" class="rule"/>
  <text x="48" y="883" class="micro">CURRENT IMPLEMENTATION: APP.PY · CORE/TRIAL.PY · CORE/SCHEMAS.PY · STATIC/APP.JS</text>
  <text x="1552" y="883" text-anchor="end" class="micro">TERMINAL BOUNDARY: DEVELOPER JUDGMENT</text>
</svg>
